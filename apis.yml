aid: triveni-bio
name: Triveni Bio
description: 'Triveni Bio is a clinical-stage biotechnology company developing first-in-class
  antibody therapeutics for immunological and inflammatory (I&I) disorders, built on a
  genetics-informed approach to target discovery combined with advanced antibody engineering.
  Its lead program TRIV-509 is a dual-specific monoclonal antibody against kallikreins 5
  and 7 (KLK5/7) for moderate-to-severe atopic dermatitis, addressing barrier dysfunction,
  inflammation and itch; TRIV-573 is a half-life-extended, second-generation bispecific
  that pairs the KLK5/7 mechanism with anti-interleukin-13 (IL-13) and entered Phase 1 in
  2026. The pipeline also includes an antibody inhibitor of trypsin 1 and 2 for hereditary
  pancreatitis driven by PRSS1 mutations. The company launched with a $92M Series A, raised
  a $115M Series B, and closed a $65M Series C in June 2026, and was named a Fierce 15
  biotech of 2025. Triveni Bio is a therapeutics developer, not a software vendor: it
  publishes no public API, developer portal, SDK or machine-readable specification.'
